server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A interface é toda em português; declarar o charset no header evita
    # depender apenas do <meta charset> para os acentos renderizarem.
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
